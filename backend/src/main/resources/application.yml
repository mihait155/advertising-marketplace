spring:
  application:
    name: advertising-marketplace-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        marketplace.images.scan: true
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: advertising-marketplace
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    login:
      max-failed-attempts: 5
      max-failed-attempts-per-account: 20
      lockout-duration: 15m
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      full-name: ${ADMIN_FULL_NAME:Administrator}
  storage:
    s3:
      bucket: ${S3_BUCKET:marketplace-images}
      region: ${S3_REGION:eu-central-1}
      endpoint: ${S3_ENDPOINT:http://localhost:9090}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      access-key: ${S3_ACCESS_KEY:local}
      secret-key: ${S3_SECRET_KEY:local}
      create-bucket: ${S3_CREATE_BUCKET:true}
      signed-url-ttl: 1h
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connect-timeout: 2s
    read-timeout: 30s
  currencies:
    supported: ${SUPPORTED_CURRENCIES:EUR,USD,GBP,RON}
  messaging:
    max-messages-per-minute: ${MESSAGING_MAX_PER_MINUTE:30}
    mask-contact-details: ${MESSAGING_MASK_CONTACT_DETAILS:false}
  notifications:
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
      from: ${EMAIL_FROM:Advertising Marketplace <no-reply@marketplace.local>}
      delay: ${EMAIL_NOTIFICATION_DELAY:5m}
      frontend-url: ${FRONTEND_URL:http://localhost:5173}
  deals:
    auto-approve-after: ${DEAL_AUTO_APPROVE_AFTER:7d}
  social:
    redirect-uri: ${SOCIAL_REDIRECT_URI:${FRONTEND_URL:http://localhost:5173}/settings/connections/callback}
    token-encryption-key: ${SOCIAL_TOKEN_ENCRYPTION_KEY:}
    twitch:
      client-id: ${TWITCH_CLIENT_ID:}
      client-secret: ${TWITCH_CLIENT_SECRET:}
      auth-url: https://id.twitch.tv/oauth2/authorize
      token-url: https://id.twitch.tv/oauth2/token
      api-url: https://api.twitch.tv/helix
      scope: moderator:read:followers
    youtube:
      client-id: ${YOUTUBE_CLIENT_ID:}
      client-secret: ${YOUTUBE_CLIENT_SECRET:}
      auth-url: https://accounts.google.com/o/oauth2/v2/auth
      token-url: https://oauth2.googleapis.com/token
      api-url: https://www.googleapis.com/youtube/v3
      scope: https://www.googleapis.com/auth/youtube.readonly
  exchange-rates:
    ecb-url: ${EXCHANGE_RATES_URL:https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml}
    refresh-on-startup: ${EXCHANGE_RATES_REFRESH_ON_STARTUP:true}
  images:
    max-size: 10MB
    max-per-posting: 20
    max-uploads-per-hour: ${IMAGE_MAX_UPLOADS_PER_HOUR:60}
    orphan-retention: 24h
