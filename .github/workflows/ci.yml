name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit and integration tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

      - name: Upload jar for the end-to-end job
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/advertising-marketplace-backend-*.jar
          retention-days: 1

  frontend:
    name: Frontend (format, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright against the real backend)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET: Y2ktb25seS1zZWNyZXQtZm9yLWVuZC10by1lbmQtdGVzdHMtMzI=
      EXCHANGE_RATES_REFRESH_ON_STARTUP: "false"
      EMAIL_NOTIFICATIONS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL, S3Mock, ClamAV and Mailpit
        run: docker compose up -d --wait postgres s3mock clamav mailpit

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: dist

      - name: Start the backend
        run: |
          nohup java -jar dist/advertising-marketplace-backend-*.jar > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz > /dev/null; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Check that the backend exported business metrics
        run: |
          curl -fsS http://localhost:8081/actuator/prometheus > metrics.txt
          grep -E '^marketplace_deals_events_total\{.*event="approved".*\} [1-9]' metrics.txt
          grep -E '^marketplace_images_uploads_total\{.*outcome="stored".*\} [1-9]' metrics.txt

      - name: Upload Playwright report and backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
